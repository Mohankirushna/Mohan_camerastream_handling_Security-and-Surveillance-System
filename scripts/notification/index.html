<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Send Email</title>
    <style>
        /* Add your styles here */
    </style>
</head>
<body>
    <div class="container">
        <h1>Send an Email</h1>
        <form id="emailForm">
            <label for="email">Recipient's Email:</label>
            <input type="email" id="email" name="email" placeholder="Enter email" required>

            <label for="subject">Subject:</label>
            <input type="text" id="subject" name="subject" placeholder="Enter subject" required>

            <label for="message">Message:</label>
            <textarea id="message" name="message" rows="5" placeholder="Enter your message" required></textarea>

            <button type="submit">Send Email</button>
        </form>
        <p id="responseMessage" style="text-align: center; color: green; display: none;"></p>
    </div>

    <script>
        document.getElementById('emailForm').addEventListener('submit', async (e) => {
            e.preventDefault(); // Prevent the form from reloading the page

            const email = document.getElementById('email').value;
            const subject = document.getElementById('subject').value;
            const message = document.getElementById('message').value;

            const responseMessage = document.getElementById('responseMessage');
            responseMessage.style.display = 'none'; // Hide any previous response message

            try {
                // Sending a POST request to your Flask backend
                const response = await fetch('http://127.0.0.1:5000/send_mail', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ email, subject, message }),
                });

                if (response.ok) {
                    responseMessage.textContent = 'Email sent successfully!';
                    responseMessage.style.color = 'green';
                    responseMessage.style.display = 'block';
                } else {
                    const errorData = await response.json();
                    responseMessage.textContent = `Failed to send email: ${errorData.error}`;
                    responseMessage.style.color = 'red';
                    responseMessage.style.display = 'block';
                }
            } catch (error) {
                responseMessage.textContent = `An error occurred: ${error.message}`;
                responseMessage.style.color = 'red';
                responseMessage.style.display = 'block';
            }
        });
    </script>
</body>
</html>
